name: PHPMailer transport smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --no-check-publish
      - run: php -d error_reporting=E_ALL tests/phpmailer_transport.php
