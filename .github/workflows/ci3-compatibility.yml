name: CI3 compatibility smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l system/core/CodeIgniter.php && php -l system/helpers/text_helper.php && php -l system/libraries/Session/PHP8SessionWrapper.php && php -l system/libraries/Xmlrpc.php && php -l system/libraries/Xmlrpcs.php
      - run: php -d error_reporting=E_ALL tests/core_345_smoke.php
