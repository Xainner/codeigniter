name: CI3 compatibility smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xml, openssl, gd, mysqli
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --no-check-publish
      - if: matrix.php == '8.4'
        run: composer audit --locked
      - run: php -l vendor/pocketarc/codeigniter/system/core/CodeIgniter.php && php -l vendor/pocketarc/codeigniter/system/helpers/text_helper.php && php -l vendor/pocketarc/codeigniter/system/libraries/Session/PHP8SessionWrapper.php && php -l vendor/pocketarc/codeigniter/system/libraries/Xmlrpc.php && php -l vendor/pocketarc/codeigniter/system/libraries/Xmlrpcs.php
      - run: php -d error_reporting=E_ALL tests/core_345_smoke.php
      - run: php -d error_reporting=E_ALL tests/xmlrpc_345_smoke.php
